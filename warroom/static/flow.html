<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legacy Siege · Flow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l12 7v14l-12 7-12-7V9z' fill='%23ffc94d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="flow.css">
</head>
<body>
<!-- Flow view: what the AI agents do, drawn as one flowchart that lights up live. -->
<header class="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3l14 8v18l-14 8-14-8V11z" fill="none" stroke="currentColor" stroke-width="3"/><path d="M20 13l6 3.5v7L20 27l-6-3.5v-7z" fill="currentColor"/></svg>
    <div>
      <div class="title">LEGACY SIEGE</div>
      <div class="tag">AI agents (“bees”) keep an old bank running while we attack it</div>
    </div>
  </div>
  <span id="night" class="chip night">Ready</span>
  <span id="conn" class="chip conn"><i></i><span id="conn-txt">connecting…</span></span>
  <nav class="controls">
    <button id="btn-start" class="btn start" title="S">Start</button>
    <span class="killgroup">
      <button id="btn-kill" class="btn kill" title="Kill the worker bee that is in the middle of a job (K)">Kill a worker</button>
      <button id="btn-queen" class="btn kill small" title="Kill the queen bee, the coordinator; the backup queen takes over (Q)">Kill the Queen</button>
    </span>
    <button id="btn-next" class="btn" title="N">Next night</button>
    <div class="more">
      <button id="btn-more" class="btn ghost" aria-haspopup="true">Reset <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
      <div id="more-pop" class="pop" hidden>
        <button data-reset="next_round">Reset this night <small>keep what the bees learned</small></button>
        <button data-reset="full">Full reset <small>wipe everything, back to Night 1</small></button>
        <hr>
        <button data-scn="bank-night-1">Run Night 1</button>
        <button data-scn="bank-night-2">Run Night 2</button>
        <button data-scn="bank-night-3">Run Night 3</button>
        <hr>
        <button id="btn-details">Details <small>MongoDB, memory search, numbers</small></button>
        <a href="./diagram">Diagram view</a>
      </div>
    </div>
  </nav>
</header>

<main id="stage-wrap">
  <div id="stage" class="stage">
    <svg id="wires" class="wires" aria-hidden="true"></svg>
    <div id="nodes"></div>
  </div>
</main>

<footer class="now"><span class="now-k">NOW</span><span id="now" class="now-t" aria-live="polite">Connecting to the live feed…</span></footer>

<div id="approval" class="approval" hidden>
  <div class="ap-k">YOUR OK IS NEEDED</div>
  <div class="ap-t" id="ap-t"></div>
  <div class="ap-d" id="ap-d"></div>
  <div class="ap-b"><button class="btn approve" id="ap-yes">Approve</button><button class="btn deny" id="ap-no">Deny</button></div>
</div>

<div id="toast" class="toast" hidden></div>

<div id="details" class="details" hidden>
  <div class="det-box">
    <div class="det-h"><h2>Details</h2><button class="x" id="det-x" aria-label="close">×</button></div>
    <div id="det-body" class="det-body"></div>
  </div>
</div>

<script type="module" src="flow.js"></script>
</body>
</html>
