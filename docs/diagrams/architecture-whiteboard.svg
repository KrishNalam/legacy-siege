<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif">
<defs>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#1d3f8f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#222" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#c62828" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#00684A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
  .b{fill:none;stroke:#1d3f8f;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .k{fill:none;stroke:#222;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .r{fill:none;stroke:#c62828;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .g{fill:none;stroke:#00684A;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .tb{fill:#1d3f8f} .tk{fill:#222} .tr{fill:#c62828} .tg{fill:#00684A}
  .h{font-size:21px;font-weight:bold} .m{font-size:16px} .s{font-size:13px} .xs{font-size:12px}
  .it{font-style:italic} .dash{stroke-dasharray:7 6}
</style>
<rect width="1600" height="1000" fill="#fbfaf6"/>

<!-- title -->
<text x="24" y="38" class="tk h" font-size="24">Legacy Siege — the whiteboard view</text>
<text x="420" y="38" class="tk s it">left: Blue swarm (blue/black ink) · centre: the legacy System · right: Red (red ink) · bottom: MongoDB Atlas spine</text>
<rect width="1600" height="1000" fill="#fbfaf6"/>
<text x="24" y="38" class="tk h" font-size="24">Legacy Siege — the whiteboard view</text>
<text x="430" y="38" class="tk s it">left: Blue swarm (blue/black ink) · centre: the legacy System · right: Red (red ink) · bottom: MongoDB Atlas spine</text>

<!-- swarm boundary -->
<path d="M22,62 Q370,56 728,64 Q734,420 726,800 Q380,806 24,798 Q18,420 22,62 Z" fill="none" stroke="#1d3f8f" stroke-dasharray="0.5 8" stroke-width="3" stroke-linecap="round"/>
<text x="250" y="84" class="tb s it">the swarm (1 OS process per agent) — dotted line = swarm boundary</text>

<!-- Platform Eng -->
<rect x="44" y="100" width="176" height="56" rx="12" class="b"/>
<text x="132" y="124" class="tb h" text-anchor="middle">Platform Eng.</text>
<text x="132" y="144" class="tb xs" text-anchor="middle">build common tools</text>
<path class="b" d="M80,156 Q76,220 70,282" marker-end="url(#ab)"/>
<text x="88" y="214" class="tb xs it">tools → Scouts</text>
<!-- tools -> Gardener loop (left edge, under the swarm) -->
<path class="b" d="M44,128 Q34,130 36,200 L38,760 Q40,780 70,780 L760,780 Q780,780 788,770" marker-end="url(#ab)"/>
<text x="60" y="772" class="tb xs it">tools → Gardener</text>

<!-- Queen -->
<ellipse cx="320" cy="200" rx="68" ry="30" class="k"/>
<text x="320" y="207" class="tk h" text-anchor="middle">Queen</text>
<text x="320" y="248" class="tk xs it" text-anchor="middle">triage · spawns Scouts</text>

<!-- Comms -->
<ellipse cx="530" cy="128" rx="80" ry="32" class="b"/>
<text x="530" y="125" class="tb h" text-anchor="middle">Comms</text>
<text x="530" y="145" class="tb s" text-anchor="middle">DB / agent (Waggle)</text>
<path class="k" d="M376,184 Q410,158 450,140" marker-end="url(#ak)"/>

<!-- Sentinel 1 -->
<ellipse cx="610" cy="232" rx="78" ry="27" class="b"/>
