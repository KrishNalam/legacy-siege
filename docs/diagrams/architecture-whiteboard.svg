<text x="1300" y="735" class="tr xs it">→ chaos_events</text>

<!-- swarm/Gardener -> spine -->
<path class="g" d="M500,800 L500,826" marker-end="url(#ag)"/>
<path class="g" d="M907,794 L907,826" marker-end="url(#ag)"/>
<path class="r" d="M1260,142 L1260,142"/>

<!-- MongoDB Atlas spine -->
<path class="g" d="M24,832 Q800,826 1576,832 Q1582,905 1576,980 Q800,986 26,980 Q18,905 24,832 Z" stroke-width="2.6"/>
<text x="44" y="862" class="tg h">MongoDB Atlas — the spine</text>
<text x="350" y="862" class="tg s it">every agent, the Gardener and Red read and write here (the Hive)</text>
<g class="g" stroke-width="1.6">
  <rect x="44" y="880" width="150" height="80" rx="10"/><rect x="208" y="880" width="150" height="80" rx="10"/>
  <rect x="372" y="880" width="150" height="80" rx="10"/><rect x="536" y="880" width="410" height="80" rx="10"/>
  <rect x="960" y="880" width="170" height="80" rx="10"/><rect x="1144" y="880" width="412" height="80" rx="10"/>
</g>
<text x="119" y="912" class="tg m" text-anchor="middle" font-weight="bold">ledger</text>
<text x="119" y="932" class="tg xs" text-anchor="middle">incidents · tasks · ops</text>
<text x="283" y="912" class="tg m" text-anchor="middle" font-weight="bold">leases</text>
<text x="283" y="932" class="tg xs" text-anchor="middle">generation fencing</text>
<text x="447" y="912" class="tg m" text-anchor="middle" font-weight="bold">checkpoints</text>
<text x="447" y="932" class="tg xs" text-anchor="middle">LangGraph, per task</text>
<text x="741" y="908" class="tg m" text-anchor="middle" font-weight="bold">playbooks + $vectorSearch</text>
<text x="741" y="928" class="tg s" text-anchor="middle">Voyage AI voyage-4 embeddings (live: local fallback)</text>
<text x="741" y="946" class="tg xs it" text-anchor="middle">round 2: same fault recalled → fixed faster</text>
<text x="1045" y="912" class="tg m" text-anchor="middle" font-weight="bold">chaos_events</text>
<text x="1045" y="932" class="tg xs" text-anchor="middle">Red's attack log</text>
<text x="1350" y="912" class="tg m" text-anchor="middle" font-weight="bold">change streams → war room</text>
<text x="1350" y="932" class="tg xs" text-anchor="middle">live map of the siege</text>
</svg>
