<!-- Nurses + Guard -->
<rect x="64" y="545" width="226" height="58" rx="12" class="b"/>
<text x="177" y="569" class="tb h" text-anchor="middle">Nurses</text>
<text x="177" y="589" class="tb xs" text-anchor="middle">expired lease → take over killed agent</text>
<path class="b" d="M215,545 Q218,505 222,470" marker-end="url(#ab)"/>
<rect x="340" y="545" width="226" height="58" rx="12" class="b"/>
<text x="453" y="569" class="tb h" text-anchor="middle">Guard</text>
<text x="453" y="589" class="tb xs" text-anchor="middle">read-back verify: catches the liar</text>
<path class="b" d="M566,566 Q690,560 790,530" marker-end="url(#ab)"/>
<text x="628" y="548" class="tb xs it">read back</text>

<!-- Sentinel 2 -->
<ellipse cx="300" cy="712" rx="92" ry="34" class="b"/>
<text x="300" y="708" class="tb h" text-anchor="middle">Sentinel 2</text>
<text x="300" y="728" class="tb xs" text-anchor="middle">repeat fault classes</text>
<path class="b" d="M315,678 L315,520 Q315,420 372,384" marker-end="url(#ab)"/>
