<text x="324" y="516" class="tb xs it" opacity="0">.</text>
<path class="b" d="M392,716 Q600,740 786,728" marker-end="url(#ab)"/>
<text x="520" y="752" class="tb s it">upgrade requests</text>

<!-- Red target cluster in swarm -->
<g fill="#c62828">
  <circle cx="640" cy="612" r="3"/><circle cx="660" cy="602" r="3"/><circle cx="682" cy="610" r="3"/><circle cx="694" cy="628" r="3"/>
  <circle cx="684" cy="646" r="3"/><circle cx="662" cy="652" r="3"/><circle cx="642" cy="644" r="3"/><circle cx="660" cy="628" r="3"/>
</g>

<!-- Gardener (outside swarm) -->
<path class="k" d="M790,690 Q905,684 1024,690 Q1028,740 1022,792 Q905,796 792,790 Q786,740 790,690 Z"/>
<text x="907" y="716" class="tk h" text-anchor="middle">Gardener</text>
<text x="907" y="738" class="tk xs" text-anchor="middle">separate system, outside the swarm</text>
<text x="907" y="758" class="tk xs it" text-anchor="middle">plan → patch → test → gate → deploy</text>
<!-- pause arrow across the boundary -->
<path class="k" d="M840,690 Q760,668 600,668" marker-end="url(#ak)" stroke-width="2.6"/>
<text x="596" y="684" class="tk s" font-weight="bold" text-anchor="end">PAUSES all agents</text>
<text x="596" y="700" class="tk xs it" text-anchor="end">during upgrades</text>

<!-- System -->
<path class="k" d="M790,300 Q912,292 1042,300 Q1050,420 1042,545 Q912,552 792,546 Q784,420 790,300 Z"/>
<text x="917" y="330" class="tk h" text-anchor="middle">System</text>
<text x="917" y="348" class="tk xs" text-anchor="middle">mock legacy bank (FastAPI)</text>
<g class="k" stroke-width="1.6">
  <rect x="812" y="362" width="210" height="48" rx="8"/><rect x="812" y="420" width="210" height="48" rx="8"/><rect x="812" y="478" width="210" height="48" rx="8"/>
</g>
<text x="917" y="384" class="tk m" text-anchor="middle">L1 web portal</text>
<text x="917" y="401" class="tk xs" text-anchor="middle">customer-facing symptom</text>
<text x="917" y="442" class="tk m" text-anchor="middle">L2 unix batch</text>
<text x="917" y="459" class="tk xs" text-anchor="middle">nightly jobs</text>
<text x="917" y="500" class="tk m" text-anchor="middle">L3 mainframe</text>
<text x="917" y="517" class="tk xs" text-anchor="middle">root cause lives here</text>

<!-- RED -->
<ellipse cx="1260" cy="110" rx="118" ry="32" class="r"/>
<text x="1260" y="106" class="tr h" text-anchor="middle">Red Scout</text>
<text x="1260" y="126" class="tr xs" text-anchor="middle">reads the Hive in MongoDB</text>
<rect x="1410" y="80" width="160" height="60" rx="10" class="r dash"/>
<text x="1490" y="104" class="tr m" text-anchor="middle" font-weight="bold">Red Commander</text>
<text x="1490" y="124" class="tr xs it" text-anchor="middle">optional · plans campaigns</text>
<path class="r" d="M1260,142 L1260,176" marker-end="url(#ar)"/>
<path class="r dash" d="M1490,140 L1490,176" marker-end="url(#ar)"/>
<text x="1500" y="164" class="tr xs it">orders</text>

<rect x="1110" y="180" width="460" height="196" rx="12" class="r"/>
<text x="1340" y="206" class="tr h" text-anchor="middle">Strikers — one per persona</text>
<text x="1340" y="226" class="tr s it" text-anchor="middle">each its own LangGraph loop: scout → plan → strike → observe</text>
<g class="r" stroke-width="1.4">
  <rect x="1126" y="240" width="140" height="56" rx="8"/><rect x="1270" y="240" width="140" height="56" rx="8"/><rect x="1414" y="240" width="140" height="56" rx="8"/>
  <rect x="1126" y="304" width="140" height="56" rx="8"/><rect x="1270" y="304" width="140" height="56" rx="8"/><rect x="1414" y="304" width="140" height="56" rx="8"/>
</g>
<text x="1196" y="264" class="tr m" text-anchor="middle" font-weight="bold">Saboteur</text>
<text x="1196" y="282" class="tr xs" text-anchor="middle">ABENDs, full disk, cron</text>
<text x="1340" y="264" class="tr m" text-anchor="middle" font-weight="bold">Assassin</text>
<text x="1340" y="282" class="tr xs" text-anchor="middle">SIGKILLs agents</text>
<text x="1484" y="264" class="tr m" text-anchor="middle" font-weight="bold">Liar</text>
<text x="1484" y="282" class="tr xs" text-anchor="middle">ACKs that don't apply</text>
<text x="1196" y="328" class="tr m" text-anchor="middle" font-weight="bold">Hacker</text>
<text x="1196" y="346" class="tr xs" text-anchor="middle">planted vulns</text>
<text x="1340" y="328" class="tr m" text-anchor="middle" font-weight="bold">Drifter</text>
<text x="1340" y="346" class="tr xs" text-anchor="middle">renames Hive fields</text>
<text x="1484" y="328" class="tr m" text-anchor="middle" font-weight="bold">Memory Striker</text>
<text x="1484" y="346" class="tr xs" text-anchor="middle">poisons playbooks</text>

<!-- Strikers -> Runner -->
<path class="r" d="M1290,376 L1290,424" marker-end="url(#ar)"/>
<text x="1300" y="406" class="tr xs it">vetted menu item</text>
<rect x="1180" y="428" width="220" height="60" rx="10" class="r"/>
<text x="1290" y="453" class="tr h" text-anchor="middle">Runner</text>
<text x="1290" y="474" class="tr xs" text-anchor="middle">fires only via chaos.runner.fire</text>

<!-- Seeded attacks -->
<rect x="1444" y="420" width="126" height="84" rx="10" class="r"/>
<text x="1507" y="446" class="tr m" text-anchor="middle" font-weight="bold">Seeded</text>
<text x="1507" y="464" class="tr m" text-anchor="middle" font-weight="bold">Chaos Monkey</text>
<text x="1507" y="484" class="tr xs" text-anchor="middle">cascade · lying</text>
<path class="r" d="M1444,460 L1404,460" marker-end="url(#ar)"/>

<!-- Runner -> System -->
<path class="r" d="M1180,450 L1048,450" marker-end="url(#ar)"/>
