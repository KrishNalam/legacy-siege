<text x="560" y="290" class="tb xs it">→ opens incident for Queen</text>

<!-- tree -->
<path class="k" d="M320,256 L320,292"/>
<path class="k" d="M320,292 Q220,304 120,349 M320,292 Q275,312 250,349 M320,292 Q360,312 385,349 M320,292 Q430,304 520,349"/>
<g class="k">
  <ellipse cx="120" cy="365" rx="22" ry="16"/><ellipse cx="250" cy="365" rx="22" ry="16"/>
  <ellipse cx="385" cy="365" rx="22" ry="16"/><ellipse cx="520" cy="365" rx="22" ry="16"/>
</g>
<text x="44" y="304" class="tk h">Scouts</text>
<text x="44" y="322" class="tk xs it">recall · diagnose</text>
<path class="k" d="M112,381 L88,440 M128,381 L150,440 M244,381 L225,440 M256,381 L278,440 M385,381 L385,440 M512,381 L480,440 M528,381 L565,440"/>
<g class="k">
  <circle cx="88" cy="452" r="12"/><circle cx="150" cy="452" r="12"/><circle cx="225" cy="452" r="12"/>
  <circle cx="278" cy="452" r="12"/><circle cx="385" cy="452" r="12"/><circle cx="480" cy="452" r="12"/><circle cx="565" cy="452" r="12"/>
</g>
<text x="44" y="496" class="tk h">Workers</text>
<text x="44" y="514" class="tk xs it">mainframe / unix / web</text>
<!-- workers act on all three tiers -->
<path class="k" d="M582,452 Q680,452 720,445"/>
<path class="k" d="M720,445 Q760,400 806,386" marker-end="url(#ak)"/>
<path class="k" d="M720,445 L806,444" marker-end="url(#ak)"/>
<path class="k" d="M720,445 Q760,490 806,502" marker-end="url(#ak)"/>
