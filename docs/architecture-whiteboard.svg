<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif">
<defs>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#1d3f8f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#222" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#c62828" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#00684A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
  .b{fill:none;stroke:#1d3f8f;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .k{fill:none;stroke:#222;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .r{fill:none;stroke:#c62828;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .g{fill:none;stroke:#00684A;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .tb{fill:#1d3f8f} .tk{fill:#222} .tr{fill:#c62828} .tg{fill:#00684A}
  .h{font-size:21px;font-weight:bold} .m{font-size:16px} .s{font-size:13px} .xs{font-size:12px}
  .it{font-style:italic}
</style>
<rect width="1600" height="1000" fill="#fbfaf6"/>

<!-- title -->
<text x="24" y="38" class="tk h" font-size="24">Legacy Siege — the whiteboard view</text>
<text x="420" y="38" class="tk s it">left: Blue swarm (blue/black ink) · centre: the legacy System · right: Red (red ink) · bottom: MongoDB Atlas spine</text>

<!-- swarm boundary (dotted) -->
<path d="M22,62 Q370,56 732,64 Q738,420 730,792 Q380,798 24,790 Q18,420 22,62 Z" fill="none" stroke="#1d3f8f" stroke-dasharray="0.5 8" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="84" class="tb s it">the swarm (1 OS process per agent) — dotted line = swarm boundary</text>

<!-- Platform Eng + Sentinels -->
<text x="78" y="124" class="tb h">Platform Eng.</text>
<text x="78" y="148" class="tb h">+ Sentinels</text>
<path class="b" d="M204,140 Q226,150 250,146" marker-end="url(#ab)"/>
<text x="256" y="142" class="tb s it">make common</text>
<text x="256" y="158" class="tb s it">tools</text>

<!-- Queen -->
<ellipse cx="300" cy="215" rx="68" ry="30" class="k" transform="rotate(-3 300 215)"/>
<text x="300" y="222" class="tk h" text-anchor="middle">Queen</text>
<path class="k" d="M234,208 Q160,214 150,160" marker-end="url(#ak)"/>

<!-- Comms -->
<ellipse cx="510" cy="140" rx="78" ry="34" class="b" transform="rotate(2 510 140)"/>
<text x="510" y="137" class="tb h" text-anchor="middle">Comms</text>
<text x="510" y="157" class="tb s" text-anchor="middle">DB / agent (Waggle)</text>
<path class="k" d="M366,204 Q400,170 430,152" marker-end="url(#ak)"/>

<!-- tree: Queen spawns Scouts -> Workers -->
<path class="k" d="M300,245 Q303,270 300,292" marker-end="url(#ak)"/>
<path class="k" d="M300,295 Q210,310 120,348 M300,295 Q270,318 250,348 M300,295 Q350,318 385,348 M300,295 Q420,310 520,348"/>
<g class="k">
  <ellipse cx="120" cy="365" rx="22" ry="16"/><ellipse cx="250" cy="365" rx="22" ry="16"/>
  <ellipse cx="385" cy="365" rx="22" ry="16"/><ellipse cx="520" cy="365" rx="22" ry="16"/>
</g>
<text x="40" y="302" class="tk h">Scouts</text>
<text x="40" y="320" class="tk xs it">recall · diagnose</text>
<!-- workers -->
<path class="k" d="M112,381 Q98,410 88,440 M126,381 Q140,410 150,440 M244,381 Q232,410 225,440 M256,381 Q268,410 278,440 M385,381 Q385,410 385,440 M512,381 Q492,410 480,440 M528,381 Q548,410 565,440"/>
<g class="k">
  <circle cx="88" cy="452" r="12"/><circle cx="150" cy="452" r="12"/><circle cx="225" cy="452" r="12"/>
  <circle cx="278" cy="452" r="12"/><circle cx="385" cy="452" r="12"/><circle cx="480" cy="452" r="12"/><circle cx="565" cy="452" r="12"/>
</g>
<text x="58" y="500" class="tk h">Workers</text>
<text x="58" y="518" class="tk xs it">mainframe / unix / web</text>
<!-- workers act on system -->
<path class="k" d="M300,482 Q560,540 786,456" marker-end="url(#ak)"/>
<text x="440" y="545" class="tk s it">act on the System</text>

<!-- Guard + Nurse note -->
<text x="80" y="600" class="tb s it">+ Guard (read-back verify: catches the lying system)</text>
<text x="80" y="620" class="tb s it">+ Nurses (expired lease → take over a killed agent)</text>

<!-- Sentinel 1 -->
<ellipse cx="600" cy="262" rx="76" ry="27" class="b" transform="rotate(-4 600 262)"/>
<text x="600" y="269" class="tb h" text-anchor="middle">Sentinel 1</text>
<path class="b" d="M790,330 Q730,300 674,272"/>
<path class="b" d="M524,262 Q440,250 368,224" marker-end="url(#ab)"/>
<text x="740" y="276" class="tb xs it" text-anchor="end" opacity="0"> </text><text x="540" y="306" class="tb xs it">watches System /health</text>
<text x="540" y="320" class="tb xs it">→ opens incident for Queen</text>

<!-- Sentinel 2 -->
<ellipse cx="370" cy="690" rx="88" ry="34" class="b" transform="rotate(3 370 690)"/>
<text x="370" y="688" class="tb h" text-anchor="middle">Sentinel 2</text>
<text x="370" y="707" class="tb xs" text-anchor="middle">repeat fault classes</text>
<!-- Sentinel 2 <-> Comms -->
<path class="b" d="M430,664 Q712,560 712,400 Q712,232 584,168" marker-start="url(#ab)" marker-end="url(#ab)"/>
<!-- Sentinel 2 -> Gardener -->
<path class="b" d="M458,700 Q620,740 800,724" marker-end="url(#ab)"/>
<text x="560" y="752" class="tb s it">upgrade requests</text>
<!-- Platform Eng loops round to Gardener -->
<path class="b" d="M72,126 Q40,128 40,200 Q34,600 60,760 Q120,812 500,808 Q750,808 784,768" marker-end="url(#ab)"/>
<text x="120" y="828" class="tb s it" opacity="0">.</text>
<text x="96" y="758" class="tb s it">Platform Eng. loop round to the Gardener (tool upgrades)</text>

<!-- dotted swarm clusters (Red targets) -->
<g fill="#1d3f8f">
  <circle cx="640" cy="112" r="3"/><circle cx="662" cy="100" r="3"/><circle cx="686" cy="110" r="3"/><circle cx="698" cy="132" r="3"/>
  <circle cx="690" cy="156" r="3"/><circle cx="666" cy="168" r="3"/><circle cx="642" cy="160" r="3"/><circle cx="632" cy="136" r="3"/>
  <circle cx="660" cy="132" r="3"/><circle cx="676" cy="140" r="3"/>
</g>
<text x="744" y="92" class="tr s it">assassin kill</text>
<text x="744" y="107" class="tr xs">(SIGKILL agents)</text>
<g fill="#1d3f8f">
  <circle cx="630" cy="610" r="3"/><circle cx="652" cy="598" r="3"/><circle cx="676" cy="606" r="3"/><circle cx="690" cy="626" r="3"/>
  <circle cx="680" cy="648" r="3"/><circle cx="656" cy="656" r="3"/><circle cx="634" cy="648" r="3"/><circle cx="650" cy="626" r="3"/><circle cx="668" cy="630" r="3"/>
</g>
<text x="652" y="586" class="tr s it" text-anchor="middle">memory poison</text>

<!-- Gardener (outside swarm) -->
<path class="k" d="M788,694 Q900,688 1022,694 Q1026,740 1020,790 Q900,794 790,788 Q784,740 788,694 Z"/>
<text x="905" y="722" class="tk h" text-anchor="middle">Gardener</text>
<text x="905" y="744" class="tk xs" text-anchor="middle">separate system, outside the swarm</text>
<text x="905" y="764" class="tk xs it" text-anchor="middle">plan → patch → test → gate → deploy</text>

<!-- System (centre) -->
<path class="k" d="M790,300 Q910,292 1040,300 Q1048,420 1040,545 Q910,552 792,546 Q784,420 790,300 Z"/>
<text x="796" y="290" class="tk m">L1 · L2 · L3</text>
<text x="915" y="330" class="tk h" text-anchor="middle">System</text>
<text x="915" y="348" class="tk xs" text-anchor="middle">mock legacy bank (FastAPI)</text>
<g class="k" stroke-width="1.6">
  <rect x="812" y="362" width="206" height="48" rx="8"/><rect x="812" y="420" width="206" height="48" rx="8"/><rect x="812" y="478" width="206" height="48" rx="8"/>
</g>
<text x="915" y="384" class="tk m" text-anchor="middle">L1 web portal</text>
<text x="915" y="401" class="tk xs" text-anchor="middle">customer-facing symptom</text>
<text x="915" y="442" class="tk m" text-anchor="middle">L2 unix batch</text>
<text x="915" y="459" class="tk xs" text-anchor="middle">nightly jobs</text>
<text x="915" y="500" class="tk m" text-anchor="middle">L3 mainframe</text>
<text x="915" y="517" class="tk xs" text-anchor="middle">root cause lives here</text>
<path class="k" d="M1030,410 Q1046,415 1030,420" stroke-width="1.4"/>
<path class="k" d="M1030,468 Q1046,473 1030,478" stroke-width="1.4"/>

<!-- RED side -->
<ellipse cx="1420" cy="120" rx="80" ry="28" class="r" transform="rotate(-2 1420 120)"/>
<text x="1420" y="127" class="tr h" text-anchor="middle">LLM'd Scout</text>
<text x="1236" y="96" class="tr xs it">reads the live system</text>
<path class="r" d="M1300,104 Q1320,112 1338,116" marker-end="url(#ar)"/>

<path class="r" d="M1420,150 Q1424,170 1420,192" marker-start="url(#ar)" marker-end="url(#ar)"/>
<rect x="1325" y="196" width="190" height="46" rx="10" class="r"/>
<text x="1420" y="218" class="tr h" text-anchor="middle">Planner</text>
<text x="1420" y="235" class="tr xs" text-anchor="middle">main orch · Red Commander</text>
<path class="r" d="M1420,242 Q1424,265 1420,288" marker-end="url(#ar)"/>
<rect x="1325" y="292" width="190" height="46" rx="10" class="r"/>
<text x="1420" y="314" class="tr h" text-anchor="middle">Striker</text>
<text x="1420" y="331" class="tr xs" text-anchor="middle">personas propose attacks</text>

<!-- Striker top line -> System top and -> assassin cluster -->
<path class="r" d="M1325,315 Q1300,316 1300,290 L1300,250 Q1300,232 1200,232 L1000,232 Q976,232 976,260 L976,288" marker-end="url(#ar)"/>
<path class="r" d="M1120,232 Q1120,180 1060,178 L712,140" marker-end="url(#ar)"/>
<text x="1130" y="224" class="tr s it">target the System</text>
<text x="850" y="182" class="tr s it">and the swarm itself</text>

<!-- Striker -> Runner -->
<path class="r" d="M1440,338 Q1440,400 1400,410 L1300,412 Q1284,414 1284,440 L1284,520" marker-end="url(#ar)"/>
<rect x="1214" y="524" width="140" height="56" rx="8" class="r"/>
<text x="1284" y="550" class="tr h" text-anchor="middle">Runner</text>
<text x="1284" y="568" class="tr xs" text-anchor="middle">only allowed attacks</text>

<!-- Seeded Attacks -->
<path class="r" d="M1430,470 Q1480,466 1530,470 Q1534,560 1530,660 Q1480,664 1432,660 Q1426,560 1430,470 Z"/>
<text x="1480" y="550" class="tr h" text-anchor="middle">Seeded</text>
<text x="1480" y="574" class="tr h" text-anchor="middle">Attacks</text>
<text x="1480" y="596" class="tr xs" text-anchor="middle">Chaos Monkey</text>
<text x="1480" y="611" class="tr xs" text-anchor="middle">cascade · lying</text>
<path class="r" d="M1428,552 Q1395,556 1358,552" marker-end="url(#ar)"/>

<!-- Runner -> System (zigzag) -->
<path class="r" d="M1214,540 L1160,540 L1160,500 L1110,500 L1110,450 L1048,450" marker-end="url(#ar)"/>
<text x="1060" y="440" class="tr s it">inject faults</text>
<!-- Runner -> memory poison cluster -->
<path class="r" d="M1214,566 Q1100,600 960,612 L700,624" marker-end="url(#ar)"/>
<text x="1020" y="632" class="tr s it">poison playbooks</text>
<!-- Runner -> DB -->
<path class="r" d="M1284,580 Q1286,640 1284,684" marker-end="url(#ar)"/>
<g class="r">
  <ellipse cx="1284" cy="698" rx="44" ry="11"/>
  <path d="M1240,698 L1240,752 Q1284,770 1328,752 L1328,698"/>
</g>
<text x="1284" y="734" class="tr m" text-anchor="middle">DB</text>
<text x="1346" y="730" class="tr xs it">chaos_events</text>
<text x="1346" y="745" class="tr xs it">(MongoDB)</text>
<path class="r" d="M1284,764 L1284,826" marker-end="url(#ar)"/>

<!-- swarm -> spine -->
<path class="g" d="M300,792 L300,826" marker-end="url(#ag)"/>
<path class="g" d="M905,792 L905,826" marker-end="url(#ag)" opacity="1"/>

<!-- MongoDB Atlas spine -->
<path class="g" d="M24,832 Q800,826 1576,832 Q1582,905 1576,980 Q800,986 26,980 Q18,905 24,832 Z" stroke-width="2.6"/>
<text x="44" y="862" class="tg h">MongoDB Atlas — the spine</text>
<text x="350" y="862" class="tg s it">every agent, the Gardener and Red read and write here</text>
<g class="g" stroke-width="1.6">
  <rect x="44" y="880" width="150" height="80" rx="10"/>
  <rect x="208" y="880" width="150" height="80" rx="10"/>
  <rect x="372" y="880" width="150" height="80" rx="10"/>
  <rect x="536" y="880" width="410" height="80" rx="10"/>
  <rect x="960" y="880" width="170" height="80" rx="10"/>
  <rect x="1144" y="880" width="412" height="80" rx="10"/>
</g>
<text x="119" y="912" class="tg m" text-anchor="middle" font-weight="bold">ledger</text>
<text x="119" y="932" class="tg xs" text-anchor="middle">incidents · tasks · ops</text>
<text x="283" y="912" class="tg m" text-anchor="middle" font-weight="bold">leases</text>
<text x="283" y="932" class="tg xs" text-anchor="middle">generation fencing</text>
<text x="447" y="912" class="tg m" text-anchor="middle" font-weight="bold">checkpoints</text>
<text x="447" y="932" class="tg xs" text-anchor="middle">LangGraph, per task</text>
<text x="741" y="908" class="tg m" text-anchor="middle" font-weight="bold">playbooks + $vectorSearch</text>
<text x="741" y="928" class="tg s" text-anchor="middle">Voyage AI voyage-4 embeddings (live: local fallback)</text>
<text x="741" y="946" class="tg xs it" text-anchor="middle">round 2: same fault recalled → fixed faster</text>
<text x="1045" y="912" class="tg m" text-anchor="middle" font-weight="bold">chaos_events</text>
<text x="1045" y="932" class="tg xs" text-anchor="middle">Red's attack log</text>
<text x="1350" y="912" class="tg m" text-anchor="middle" font-weight="bold">change streams → war room</text>
<text x="1350" y="932" class="tg xs" text-anchor="middle">live map of the siege</text>
</svg>
